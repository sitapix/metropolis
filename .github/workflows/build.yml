name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install toolchain
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      # The committed binaries are what people download, so they are checked
      # before anything overwrites them.
      - name: Check committed fonts
        run: make check

      - name: Build from source
        run: make all

      - name: Check fresh build
        run: make check

      - uses: actions/upload-artifact@v4
        with:
          name: fonts
          path: fonts/
