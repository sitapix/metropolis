<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta http-equiv="X-UA-Compatible" content="ie=edge" />
		<meta name="description" content="{{ site.description }}" />
		{%- for metatag in site.metatags %}
		<meta{% for m in metatag %} {{m[0]}}="{{m[1]|escape}}" {% endfor %} />
		{%- endfor %}
		<title>
			{{ site.title or renderData.title or title or metadata.title }}
		</title>
		<link
			rel="stylesheet"
			href="{% webpackAssetPath '../css/main.css' %}"
		/>
		<script defer src="{% webpackAssetPath '../js/main.js' %}"></script>
		<script>
			// Stamp the attribute only when the visitor has actually chosen a
			// mode. Leaving it absent lets prefers-color-scheme decide, and
			// avoids writing the literal string "null" on a first visit.
			(function() {
				var stored = localStorage.getItem("dark-mode");
				if (stored === "true" || stored === "false") {
					document.documentElement.setAttribute(
						"data-dark-mode",
						stored
					);
				}
			})();
		</script>
	</head>

	<body>
		{{ content }}
	</body>
	<script>
		document
			.querySelector(".dark-mode-toggle")
			.addEventListener("click", () => {
				const stored = localStorage.getItem("dark-mode");
				// Read the effective mode, not just storage. Without the
				// media-query fallback the first click on a dark-by-default
				// system stores "true" and appears to do nothing.
				const isDarkMode =
					stored === "true" || stored === "false"
						? stored === "true"
						: window.matchMedia("(prefers-color-scheme: dark)")
								.matches;
				document.documentElement.setAttribute(
					"data-dark-mode",
					String(!isDarkMode)
				);
				localStorage.setItem("dark-mode", String(!isDarkMode));
			});
	</script>
</html>
