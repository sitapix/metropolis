<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="description" content="{{ site.description }}" />
		<meta name="color-scheme" content="light dark" />
		{%- for metatag in site.metatags %}
		<meta{% for m in metatag %} {{m[0]}}="{{m[1]|escape}}" {% endfor %} />
		{%- endfor %}
		<title>{{ site.title }} type specimen</title>
		<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='13' cy='16' r='11' fill='%23f97316'/%3E%3Ccircle cx='23' cy='16' r='7' fill='%232563eb'/%3E%3C/svg%3E" />
		<link rel="stylesheet" href="{% webpackAssetPath '../css/main.css' %}" />
		<script defer src="{% webpackAssetPath '../js/main.js' %}"></script>
		<script>
			// Apply a stored theme before first paint. With nothing stored,
			// prefers-color-scheme decides in CSS.
			(function() {
				try {
					var t = localStorage.getItem("theme");
					if (t === "dark" || t === "light") {
						document.documentElement.setAttribute("data-theme", t);
					}
				} catch (e) {}
			})();
		</script>
	</head>

	<body>
		<a class="skip-link" href="#playground">Skip to the type tester</a>
		{{ content }}
	</body>
</html>
