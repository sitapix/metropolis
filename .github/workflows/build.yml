name: build

on:
  push:
    branches: [main, "codex/ci-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      fonts: ${{ steps.changes.outputs.fonts }}
      rebuild: ${{ steps.changes.outputs.rebuild }}
      artwork: ${{ steps.changes.outputs.artwork }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Test CI scope and Python syntax
        run: |
          python3 -m unittest discover -s tests -v
          python3 -m compileall -q scripts
      - id: changes
        name: Select checks from changed inputs
        run: python3 scripts/ci_changes.py

  build:
    needs: changes
    if: needs.changes.outputs.fonts == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: fonts-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "requirements*.txt"
          cache-suffix: fonts
      - name: Install toolchain
        env:
          REBUILD: ${{ needs.changes.outputs.rebuild }}
        run: |
          uv venv
          if [ "$REBUILD" = true ]; then
            uv pip install -r requirements.txt
          else
            uv pip install -r requirements-check.txt
          fi
      - name: Check committed fonts
        run: make check
      - name: Keep committed fonts
        if: needs.changes.outputs.rebuild == 'true'
        run: cp -R fonts "$RUNNER_TEMP/committed-fonts"
      - name: Build from source
        if: needs.changes.outputs.rebuild == 'true'
        run: |
          make clean
          make all
      - name: Check fresh build
        if: needs.changes.outputs.rebuild == 'true'
        run: make check
      - name: Check committed fonts match the sources
        if: needs.changes.outputs.rebuild == 'true'
        run: .venv/bin/python scripts/compare_fonts.py "$RUNNER_TEMP/committed-fonts" fonts
      - uses: actions/upload-artifact@v7.0.1
        if: needs.changes.outputs.rebuild == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: fonts
          path: fonts/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  artwork:
    needs: changes
    if: needs.changes.outputs.artwork == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: artwork-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            requirements-check.txt
            requirements-artwork.txt
          cache-suffix: artwork
      - name: Install artwork dependencies
        run: |
          uv venv
          uv pip install -r requirements-artwork.txt
      - name: Check the SVG artwork is current
        run: |
          make specimen-image
          if [ -n "$(git status --porcelain -- documentation/)" ]; then
            echo "Artwork is stale. Run 'make specimen-image' and commit."
            git status --short -- documentation/
            exit 1
          fi
